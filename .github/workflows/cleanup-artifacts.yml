name: Cleanup artifacts

on:
  schedule:
    - cron: "0 12 * * 1" # weekly Monday 12:00 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than 3 days
        uses: actions/github-script@v7
        with:
          script: |
            const retentionMs = 3 * 24 * 60 * 60 * 1000;
            const cutoff = Date.now() - retentionMs;
            const { owner, repo } = context.repo;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            if (artifacts.length === 0) {
              core.info("No artifacts found.");
              return;
            }

            let deleted = 0;
            for (const artifact of artifacts) {
              if (new Date(artifact.created_at).getTime() >= cutoff) {
                continue;
              }

              try {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
                deleted++;
                core.info(
                  `Deleted ${artifact.name} (#${artifact.id}, created ${artifact.created_at})`
                );
              } catch (error) {
                const status =
                  error.status || (error.response && error.response.status);
                if (status === 404) {
                  core.info(
                    `Already gone: ${artifact.name} (#${artifact.id})`
                  );
                  continue;
                }
                throw error;
              }
            }

            core.info(
              `Done. Deleted ${deleted} artifact(s) older than 3 days.`
            );
